name: wms-dev

services:
  mysql:
    image: mysql:8.4
    container_name: wms-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wms}
      MYSQL_USER: ${MYSQL_USER:-wms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wms123456}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/yian_wms_20260320.sql:/docker-entrypoint-initdb.d/01-yian-wms.sql:ro
      - ./sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ./sql/wms.sql:/docker-entrypoint-initdb.d/03-wms.sql:ro
      - ./sql/migrations/V1.1.0__wms_core_extensions.sql:/docker-entrypoint-initdb.d/04-wms-core-extensions.sql:ro
      - ./sql/demo/wms_demo_seed.sql:/docker-entrypoint-initdb.d/05-wms-demo-seed.sql:ro
      - ./sql/demo/wms_demo_refresh.sql:/docker-entrypoint-initdb.d/06-wms-demo-refresh.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
